<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <title>产品详情 - Lang Gan Wooden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .detail-section {
            padding-top: 130px;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        .detail-img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .detail-category {
            display: inline-block;
            background: #e8f4f8;
            color: #0d6efd;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .detail-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d9534f;
            margin-bottom: 1.5rem;
        }
        .detail-price .old-price {
            font-size: 1rem;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: 400;
        }
        .detail-info {
            margin-bottom: 2rem;
        }
        .detail-info h5 {
            font-weight: 600;
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        .detail-info p {
            color: #666;
            line-height: 1.8;
        }
        .contact-btn {
            padding: 12px 40px;
            font-size: 1.05rem;
            border-radius: 30px;
        }
        .not-found {
            text-align: center;
            padding: 100px 20px;
        }
        .not-found h2 {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- ==================== 导航栏 ==================== -->
    <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Lang Gan<span class="brand-dot"></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Products.html">产品展示</a></li>
                    <li class="nav-item"><a class="nav-link" href="features.html">产品特征</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">关于我们</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">联系我们</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ==================== 产品详情 ==================== -->
    <section class="detail-section">
        <div class="container">
            <div id="detailContent" class="not-found">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
            </div>
        </div>
    </section>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var productId = params.get('id');

        var products = {
            '001': {
                name: '逐光鹿',
                image: 'img/products-1.jpg',
                category: '生活摆件',
                price: '¥19',
                oldPrice: '¥27',
                description: '逐光鹿，献给热爱生活、勇攀高峰的你。纯手工雕刻，黑胡桃木精制。',

                craft: '纯手工雕刻',
                size: '约 15cm × 8cm × 20cm'
            },
            '002': {
                name: '纸巾立挂',
                image: 'img/product-2.jpg',
                category: '家具系列',
                price: '¥25',
                oldPrice: '¥36',
                description: '木艺纸巾架，让生活充满治愈小确辛。',

            },
            '003': {
                name: '精雕花鸟梳',
                image: 'img/product-3.jpg',
                category: '生活用品',
                price: '¥68',
                oldPrice: null,
                description: '用生活的场景雕刻，带您领略木艺古典之美。',
                material: '黄杨木',
                craft: '精雕细刻',
                size: '约 12cm × 5cm'
            },
            '004': {
                name: '原木装饰镜',
                image: 'img/product-4.jpg',
                category: '家具系列',
                price: '¥58',

                description: '匠心原木雕，映出生活自然之美。',
                material: '橡木',
                craft: '手工雕刻',
                size: '约 30cm × 40cm'
            },
            '005': {
                name: '羊角木梳',
                image: 'img/product-5.jpg',
                category: '生活用品',
                price: '¥99',
                oldPrice: null,
                description: '羊角木梳，用打磨促使透光的羊角，透亮你的美。',
                material: '羊角 + 红木',
                craft: '手工打磨抛光',
                size: '约 18cm × 5cm'
            },
            '006': {
                name: '木制餐碗',
                image: 'img/product-6.jpg',
                category: '厨房用品',
                price: '¥35',
                oldPrice: '¥46',
                description: '质朴木器，三餐陪伴，一日三餐烟火温暖。',
                material: '枫木',
                craft: '车旋工艺',
                size: '约 15cm × 7cm'
            },
            '007': {
                name: '萌趣木雕',
                image: 'img/product-7.jpg',
                category: '生活摆件',
                price: '¥89',
                oldPrice: null,
                description: '萌趣企鹅立桌角治愈时光满心欢喜。',
                material: '榉木',

                size: '约 8cm × 8cm × 12cm'
            },
            '008': {
                name: '足球木雕',

                price: '¥79',
                oldPrice: '¥99',
                description: '足球造型木雕摆件，献给热爱运动的你。',
                material: '黑胡桃木',
                craft: '手工雕刻',
                size: '约 10cm × 10cm × 10cm'
            },
            '009': {
                name: '红木茶铲',
                image: 'img/product-9.jpg',
                category: '茶道器具',
                price: '¥45',
                oldPrice: '¥62',
                description: '精选红木手工打磨，茶席间的优雅器物。',
                material: '红木',
                craft: '手工打磨',
                size: '约 15cm × 4cm'
            },
            '010': {
                name: '竹节笔筒',
                image: 'img/product-10.jpg',
                category: '文房雅器',
                price: '¥76',
                oldPrice: null,
                description: '以竹为形，木为载体，书案之上的一抹清雅。',
                material: '楠竹',

            },
            '011': {
                name: '实木花架',
                image: 'img/product-11.jpg',
                category: '家具系列',
                price: '¥128',
                oldPrice: '¥168',
                description: '简约实木花架，让绿植与木艺相映成趣。',

            },
            '012': {
                name: '猫头鹰木雕',
                image: 'img/product-12.jpg',
                category: '生活摆件',
                price: '¥96',
                oldPrice: null,
                description: '憨态可掬的猫头鹰，守护你的书桌时光。',
                material: '胡桃木',
                craft: '手工雕刻',
                size: '约 10cm × 8cm × 15cm'
            }
        };

        var product = products[productId];
        var container = document.getElementById('detailContent');

        if (!product) {
            container.innerHTML = '<div class="not-found"><h2><i class="bi bi-emoji-frown"></i></h2><p style="font-size:1.2rem;color:#999;">未找到该产品</p><a href="Products.html" class="btn btn-outline-primary rounded-pill mt-3">返回产品展示</a></div>';
            return;
        }

        var oldPriceHtml = product.oldPrice ? '<span class="old-price">' + product.oldPrice + '</span>' : '';

        var html = '<div class="row g-5 align-items-start">';
        html += '<div class="col-lg-6">';
        html += '<img src="' + product.image + '" alt="' + product.name + '" class="detail-img">';
        html += '</div>';
        html += '<div class="col-lg-6">';
        html += '<span class="detail-category">' + product.category + '</span>';
        html += '<h1 class="detail-title">' + product.name + '</h1>';
        html += '<div class="detail-price">' + product.price + oldPriceHtml + '</div>';
        html += '<p class="text-muted" style="font-size:1.05rem;">' + product.description + '</p>';
        html += '<div class="detail-info">';
        html += '<h5>材质</h5><p>' + product.material + '</p>';
        html += '<h5>工艺</h5><p>' + product.craft + '</p>';
        html += '<h5>规格尺寸</h5><p>' + product.size + '</p>';
        html += '</div>';
        html += '<a href="contact.html" class="btn btn-primary contact-btn"><i class="bi bi-chat-dots me-2"></i>查看详情</a>';
        html += '<a href="Products.html" class="btn btn-outline-secondary contact-btn ms-3"><i class="bi bi-arrow-left me-2"></i>返回产品</a>';
        html += '</div></div>';

        container.innerHTML = html;
    })();
    </script>
</body>
</html>
