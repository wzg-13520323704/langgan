<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <title>产品详情 - Lang Gan Wooden</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null;">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></noscript>
    <link rel="stylesheet" href="css/style.css?v=1">
    <style>
        .detail-section {
            padding-top: 130px;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        .detail-img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .detail-category {
            display: inline-block;
            background: #e8f4f8;
            color: #0d6efd;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .detail-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d9534f;
            margin-bottom: 1.5rem;
        }
        .detail-price .old-price {
            font-size: 1rem;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: 400;
        }
        .detail-info {
            margin-bottom: 2rem;
        }
        .detail-info h5 {
            font-weight: 600;
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        .detail-info p {
            color: #666;
            line-height: 1.8;
        }
        .contact-btn {
            padding: 12px 40px;
            font-size: 1.05rem;
            border-radius: 30px;
        }
        .not-found {
            text-align: center;
            padding: 100px 20px;
        }
        .not-found h2 {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 1rem;
        }
        .idea-contact-section {
            margin-top: 60px;
            padding: 40px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.06);
            text-align: center;
        }
        .idea-contact-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .idea-contact-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
        }
        .idea-contact-desc {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 24px;
        }
        .idea-contact-btn {
            display: inline-block;
            padding: 14px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%);
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.3);
        }
        .idea-contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ==================== 导航栏 ==================== -->
    <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Lang Gan<span class="brand-dot"></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="navHome">首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Products.html" data-i18n="navProducts">产品展示</a></li>
                    <li class="nav-item"><a class="nav-link" href="features.html" data-i18n="navFeatures">产品特征</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html" data-i18n="navAbout">关于我们</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html" data-i18n="navContact">联系我们</a></li>
                </ul>
            </div>
            <div class="lang-switch">
                <select id="langSelect">
                    <option value="zh">🇨🇳 中文</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- ==================== 产品详情 ==================== -->
    <section class="detail-section">
        <div class="container">
            <div id="detailContent" class="not-found">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden" data-i18n="prodDetailLoading">加载中...</span>
                </div>
            </div>
        </div>
    </section>

    <script src="js/products-data.js?v=1"></script>
    <script>
    var _pdParams = new URLSearchParams(window.location.search);
    var _pdId = _pdParams.get('id');
    var _pdContainer = document.getElementById('detailContent');

    var _pdProducts = (function() {
    var defaults = {
        '生活摆件': { material:{zh:'黄杨木/黑胡桃木',en:'Boxwood / Black Walnut'}, craft:{zh:'手工雕刻',en:'Hand Carved'}, size:{zh:'约 15cm × 8cm × 20cm',en:'Approx. 15cm × 8cm × 20cm'} },
        '家具系列': { material:{zh:'橡木/榉木',en:'Oak / Beech'}, craft:{zh:'榫卯工艺',en:'Mortise & Tenon'}, size:{zh:'约 30cm × 20cm × 40cm',en:'Approx. 30cm × 20cm × 40cm'} },
        '生活用品': { material:{zh:'榉木',en:'Beech'}, craft:{zh:'手工打磨',en:'Hand Polished'}, size:{zh:'约 10cm × 5cm × 15cm',en:'Approx. 10cm × 5cm × 15cm'} },
        '厨房用品': { material:{zh:'榉木',en:'Beech'}, craft:{zh:'整木挖制',en:'Solid Wood Carved'}, size:{zh:'约 20cm × 15cm × 5cm',en:'Approx. 20cm × 15cm × 5cm'} },
        '茶道器具': { material:{zh:'红木/竹',en:'Rosewood / Bamboo'}, craft:{zh:'手工打磨',en:'Hand Polished'}, size:{zh:'约 10cm × 5cm × 5cm',en:'Approx. 10cm × 5cm × 5cm'} },
        '文房雅器': { material:{zh:'竹/黄杨木',en:'Bamboo / Boxwood'}, craft:{zh:'手工打磨',en:'Hand Polished'}, size:{zh:'约 10cm × 5cm × 8cm',en:'Approx. 10cm × 5cm × 8cm'} },
        '运动摆件': { material:{zh:'黄杨木',en:'Boxwood'}, craft:{zh:'手工雕刻',en:'Hand Carved'}, size:{zh:'约 15cm × 10cm × 15cm',en:'Approx. 15cm × 10cm × 15cm'} }
    };
    var result = {};
    if (typeof PRODUCTS === 'undefined') return result;
    for (var i = 0; i < PRODUCTS.length; i++) {
        var p = PRODUCTS[i];
        var def = defaults[p.category] || defaults['生活摆件'];
        result[p.id] = {
            name: p.name,
            image: p.image,
            category: { zh: p.category, en: (PRODUCT_CATEGORIES[p.category] || {}).en || p.category },
            price: '¥' + p.price,
            oldPrice: p.oldPrice ? '¥' + p.oldPrice : '',
            description: p.desc,
            material: p.material || def.material,
            craft: p.craft || def.craft,
            size: p.size || def.size
        };
    }
    return result;
})();

    function _pdRender(lang) {
        lang = lang || 'zh';
        var product = _pdProducts[_pdId];

        if (!product) {
            _pdContainer.innerHTML = '<div class="not-found"><h2><i class="bi bi-emoji-frown"></i></h2><p style="font-size:1.2rem;color:#999;">' + (lang === 'en' ? 'Product Not Found' : '未找到该产品') + '</p><a href="Products.html" class="btn btn-outline-primary rounded-pill mt-3">' + (lang === 'en' ? 'Back to Products' : '返回产品展示') + '</a></div>';
            return;
        }

        var oldPriceHtml = product.oldPrice ? '<span class="old-price">' + product.oldPrice + '</span>' : '';

        // Build thumbnail gallery (use image as main + alternate placeholders)
        var altImages = product.altImages || [];
        if (!altImages.length) altImages = [product.image];
        var galleryHtml = '<div class="detail-gallery">';
        galleryHtml += '<img src="' + product.image + '" alt="' + product.name[lang] + '" class="detail-gallery-main" id="detailMainImg">';
        galleryHtml += '<div class="detail-thumbnails">';
        for (var ti = 0; ti < Math.min(altImages.length, 4); ti++) {
            var activeClass = (ti === 0) ? ' active' : '';
            galleryHtml += '<img src="' + altImages[ti] + '" class="detail-thumb' + activeClass + '" data-img="' + altImages[ti] + '" onclick="document.getElementById(\'detailMainImg\').src=this.getAttribute(\'data-img\');var sibs=this.parentElement.children;for(var j=0;j<sibs.length;j++)sibs[j].classList.remove(\'active\');this.classList.add(\'active\')">';
        }
        galleryHtml += '</div></div>';

        var html = '<div class="row g-5 align-items-start">';
        html += '<div class="col-lg-6">';
        html += galleryHtml;
        html += '</div>';
        html += '<div class="col-lg-6">';
        html += '<span class="detail-category">' + product.category[lang] + '</span>';
        html += '<h1 class="detail-title">' + product.name[lang] + '</h1>';
        html += '<div class="detail-price">' + product.price + oldPriceHtml + '</div>';
        html += '<p class="text-muted" style="font-size:1.05rem;">' + product.description[lang] + '</p>';
        html += '<div class="detail-info">';
        html += '<table class="specs-table"><tbody>';
        html += '<tr><td><i class="bi bi-tree me-1"></i>' + (lang === 'en' ? 'Material' : '材质') + '</td><td>' + product.material[lang] + '</td></tr>';
        html += '<tr><td><i class="bi bi-hammer me-1"></i>' + (lang === 'en' ? 'Craft' : '工艺') + '</td><td>' + product.craft[lang] + '</td></tr>';
        html += '<tr><td><i class="bi bi-arrows-angle-expand me-1"></i>' + (lang === 'en' ? 'Size' : '规格') + '</td><td>' + product.size[lang] + '</td></tr>';
        if (product.shipping) html += '<tr><td><i class="bi bi-truck me-1"></i>' + (lang === 'en' ? 'Shipping' : '发货') + '</td><td>' + product.shipping[lang] + '</td></tr>';
        if (product.warranty) html += '<tr><td><i class="bi bi-shield-check me-1"></i>' + (lang === 'en' ? 'Warranty' : '售后') + '</td><td>' + product.warranty[lang] + '</td></tr>';
        html += '</tbody></table>';
        html += '</div>';
        html += '<a href="inquiry.html?id=' + _pdId + '&name=' + encodeURIComponent(product.name[lang]) + '&price=' + parseFloat(product.price.replace('¥','')) + '&image=' + encodeURIComponent(product.image) + '" class="btn btn-primary contact-btn" style="background:linear-gradient(135deg,#ff6b35,#e55a2b);border:none;"><i class="bi bi-chat-dots me-2"></i>' + (lang === 'en' ? 'Contact to Buy' : '联系购买') + '</a>';
        html += '<a href="Products.html" class="btn btn-outline-secondary contact-btn ms-3"><i class="bi bi-arrow-left me-2"></i>' + (lang === 'en' ? 'Back to Products' : '返回产品') + '</a>';
        html += '</div></div>';

        // Craftsman's note
        html += '<div class="craftsman-note">';
        html += '<div class="craftsman-note-header"><i class="bi bi-chat-quote"></i><h5>' + (lang === 'en' ? 'From Our Craftsmaster' : '匠人寄语') + '</h5></div>';
        html += '<p>' + (lang === 'en' ? 'Every piece is handcrafted with passion and precision. We select only the finest woods, carved through hundreds of meticulous steps, to bring you a work of art that carries the warmth of nature and the soul of craftsmanship.' : '每一件作品都倾注了匠人的心血与技艺。我们精选上等木材，经过数百道工序手工打磨，只为将最自然、最温暖的木艺之作呈现于您，愿您感受来自手工艺的温度与灵魂。') + '</p>';
        html += '</div>';

        html += '<div class="idea-contact-section">';
        html += '<div class="idea-contact-icon"><i class="bi bi-lightbulb"></i></div>';
        html += '<h3 class="idea-contact-title">' + (lang === 'en' ? 'Have an Innovative Idea?' : '您有更多新颖、创新的想法？') + '</h3>';
        html += '<p class="idea-contact-desc">' + (lang === 'en' ? 'If you have more creative and innovative ideas, please contact our designers through the form. We look forward to bringing your vision to life.' : '如果您有更多新颖、创新的想法，请通过表单联系我们的设计师了解。我们期待将您的愿景变为现实。') + '</p>';
        html += '<a href="contact.html" class="idea-contact-btn"><i class="bi bi-stars me-2"></i>' + (lang === 'en' ? 'Realize Your Idea' : '实现想法') + '</a>';
        html += '</div>';

        _pdContainer.innerHTML = html;

        var selectEl = document.getElementById('langSelect');
        if (selectEl) selectEl.value = lang;
    }
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/i18n.js?v=3" defer></script>
    <script src="js/main.js?v=2" defer></script>
    <script>
    (function() {
        var savedLang = localStorage.getItem('lang') || 'zh';
        _pdRender(savedLang);

        var selectEl = document.getElementById('langSelect');
        if (selectEl) {
            selectEl.addEventListener('change', function() {
                _pdRender(this.value);
            });
        }
    })();
    </script>

    <!-- Sticky Add to Cart 底部栏 -->
    <div class="sticky-cart-bar" id="stickyCartBar">
        <div class="container sticky-inner">
            <div class="sticky-product">
                <img src="" alt="" id="stickyCartImg">
                <div class="sticky-info">
                    <div class="sticky-name" id="stickyCartName"></div>
                    <div class="sticky-price" id="stickyCartPrice"></div>
                </div>
            </div>
            <a href="inquiry.html" id="stickyCartLink" class="btn btn-primary rounded-pill px-4"><i class="bi bi-chat-dots me-2"></i></a>
        </div>
    </div>
    <script>
    (function(){
        var p = _pdProducts[_pdId];
        if (p) {
            var lang = localStorage.getItem('lang') || 'zh';
            document.getElementById('stickyCartImg').src = p.image;
            document.getElementById('stickyCartName').textContent = p.name[lang];
            document.getElementById('stickyCartPrice').textContent = p.price;
            var link = document.getElementById('stickyCartLink');
            link.href = 'inquiry.html?id=' + _pdId + '&name=' + encodeURIComponent(p.name[lang]) + '&price=' + parseFloat(p.price.replace('¥','')) + '&image=' + encodeURIComponent(p.image);
            link.innerHTML = '<i class="bi bi-chat-dots me-2"></i>' + (lang==='en'?'Contact to Buy':'联系购买');
        }
    })();
    </script>
</body>
</html>
